<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .num { fill: #0969da; }
    .numtext { fill: #ffffff; font-weight: 700; }
    .title { fill: #1f2328; font-weight: 700; }
    .step { fill: #1f2328; font-weight: 600; }
    .desc { fill: #57606a; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; marker-end: url(#head); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .num { fill: #58a6ff; }
      .title { fill: #e6edf3; }
      .step { fill: #e6edf3; }
      .desc { fill: #8b949e; }
      .arrow { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="head" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="desc" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="460"/>
  <text x="490" y="34" text-anchor="middle" class="title" font-size="22">Starting a codespace in your browser</text>

  <!-- Row 1 -->
  <g>
    <rect class="card" x="30" y="60" width="270" height="150" rx="10"/>
    <circle class="num" cx="62" cy="90" r="16"/>
    <text x="62" y="96" text-anchor="middle" class="numtext" font-size="16">1</text>
    <text x="90" y="96" class="step" font-size="15">Open the cargo page</text>
    <text x="50" y="130" class="desc" font-size="12">Go to the course's GitHub</text>
    <text x="50" y="148" class="desc" font-size="12">page in any web browser.</text>
    <text x="50" y="166" class="desc" font-size="12">No account setup needed</text>
    <text x="50" y="184" class="desc" font-size="12">beyond a free GitHub login.</text>
  </g>

  <path class="arrow" d="M300 135 L350 135"/>

  <g>
    <rect class="card" x="355" y="60" width="270" height="150" rx="10"/>
    <circle class="num" cx="387" cy="90" r="16"/>
    <text x="387" y="96" text-anchor="middle" class="numtext" font-size="16">2</text>
    <text x="415" y="96" class="step" font-size="15">Use this template</text>
    <text x="375" y="130" class="desc" font-size="12">Click the green</text>
    <text x="375" y="148" class="desc" font-size="12">"Use this template" button,</text>
    <text x="375" y="166" class="desc" font-size="12">then "Create a new</text>
    <text x="375" y="184" class="desc" font-size="12">repository." This makes</text>
    <text x="375" y="202" class="desc" font-size="12">your own private copy.</text>
  </g>

  <path class="arrow" d="M625 135 L675 135"/>

  <g>
    <rect class="card" x="680" y="60" width="270" height="150" rx="10"/>
    <circle class="num" cx="712" cy="90" r="16"/>
    <text x="712" y="96" text-anchor="middle" class="numtext" font-size="16">3</text>
    <text x="740" y="96" class="step" font-size="15">Name your copy</text>
    <text x="700" y="130" class="desc" font-size="12">Type any name you like</text>
    <text x="700" y="148" class="desc" font-size="12">and click the green</text>
    <text x="700" y="166" class="desc" font-size="12">"Create repository" button.</text>
    <text x="700" y="184" class="desc" font-size="12">This is now yours to keep.</text>
  </g>

  <!-- wrap arrow from step 3 to step 4 -->
  <path class="arrow" d="M815 210 C815 250, 190 250, 190 288"/>

  <!-- Row 2 -->
  <g>
    <rect class="card" x="30" y="295" width="270" height="150" rx="10"/>
    <circle class="num" cx="62" cy="325" r="16"/>
    <text x="62" y="331" text-anchor="middle" class="numtext" font-size="16">4</text>
    <text x="90" y="331" class="step" font-size="15">Create a codespace</text>
    <text x="50" y="365" class="desc" font-size="12">On your new repository's</text>
    <text x="50" y="383" class="desc" font-size="12">page, click "Code" then the</text>
    <text x="50" y="401" class="desc" font-size="12">"Codespaces" tab, then</text>
    <text x="50" y="419" class="desc" font-size="12">"Create codespace on main."</text>
  </g>

  <path class="arrow" d="M300 370 L350 370"/>

  <g>
    <rect class="card" x="355" y="295" width="270" height="150" rx="10"/>
    <circle class="num" cx="387" cy="325" r="16"/>
    <text x="387" y="331" text-anchor="middle" class="numtext" font-size="16">5</text>
    <text x="415" y="331" class="step" font-size="15">Wait for it to build</text>
    <text x="375" y="365" class="desc" font-size="12">The first time takes a few</text>
    <text x="375" y="383" class="desc" font-size="12">minutes — it's installing all</text>
    <text x="375" y="401" class="desc" font-size="12">your tools. Just watch it go.</text>
  </g>

  <path class="arrow" d="M625 370 L675 370"/>

  <g>
    <rect class="card" x="680" y="295" width="270" height="150" rx="10"/>
    <circle class="num" cx="712" cy="325" r="16"/>
    <text x="712" y="331" text-anchor="middle" class="numtext" font-size="16">6</text>
    <text x="740" y="331" class="step" font-size="15">You're in!</text>
    <text x="700" y="365" class="desc" font-size="12">A code editor opens in your</text>
    <text x="700" y="383" class="desc" font-size="12">browser tab. That's it — you</text>
    <text x="700" y="401" class="desc" font-size="12">now have a full dev setup.</text>
  </g>
</svg>
